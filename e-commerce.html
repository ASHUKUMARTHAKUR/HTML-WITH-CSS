<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        /* HEADER */
        header {
            background-color: #222;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #ff9800;
        }

        nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        /* BANNER */
        .banner {
            background-color: #ff9800;
            color: white;
            padding: 40px;
            text-align: center;
        }

        /* PRODUCTS */
        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .product {
            background-color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product h3 {
            margin: 10px 0;
        }

        .product p {
            color: green;
            font-weight: bold;
        }

        .product button {
            margin-top: 10px;
            padding: 8px 15px;
            background-color: #ff9800;
            color: white;
            border: none;
            cursor: pointer;
        }

        .product button:hover {
            background-color: #e68900;
        }

        /* FOOTER */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header>
    <h1>ShopEasy</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart</a>
        <a href="#">Contact</a>
    </nav>
</header>

<!-- BANNER -->
<div class="banner">
    <h2>Welcome to ShopEasy</h2>
    <p>Best Deals | Best Prices</p>
</div>

<!-- PRODUCTS -->
<div class="products">

    <div class="product">
        <img src="https://m.media-amazon.com/images/I/81fxjeu8fdL._AC_UL480_FMwebp_QL65_.jpg">
        <h3>Smartphone</h3>
        <p>₹12,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://m.media-amazon.com/images/I/61L5QgPvgqL._AC_UL480_FMwebp_QL65_.jpg">
        <h3>Laptop</h3>
        <p>₹45,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://m.media-amazon.com/images/I/71j8damPo5L._AC_UL480_FMwebp_QL65_.jpg">
        <h3>Headphones</h3>
        <p>₹1,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://m.media-amazon.com/images/I/71xHyqBwdcL._AC_UL480_FMwebp_QL65_.jpg">
        <h3>Washing Machine</h3>
        <p>₹18,499</p>
        <button>Add to Cart</button>
    </div>

</div>

<!-- FOOTER -->
<footer>
    © 2026 ShopEasy | E-Commerce Website Project
</footer>

</body>
</html>
